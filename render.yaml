services:
  - type: web
    name: aurevo-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: PUBLIC_SERVER_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MTBP_BASE_URL
        value: https://api.themoviedb.org/3
      - key: MTBP_API_KEY_1
        sync: false
      - key: MTBP_API_KEY_2
        sync: false
      - key: MTBP_API_KEY_3
        sync: false
      - key: YT_API_KEY_1
        sync: false
      - key: YT_API_KEY_2
        sync: false
      - key: YT_API_KEY_3
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: USDT_TRC20_WALLET_ADDRESS
        sync: false
      - key: ADMIN_SECRET
        sync: false
